# Configuración mínima de Cowrie (sobrescribe cowrie.cfg.dist).
# Documentación: https://docs.cowrie.org

[honeypot]
# Nombre de host que ve el atacante. Debe resultar verosímil.
hostname = srv-app-01

[ssh]
enabled = true
listen_endpoints = tcp:2222:interface=0.0.0.0
version = SSH-2.0-OpenSSH_8.2p1 Ubuntu-4ubuntu0.5

[telnet]
enabled = true
listen_endpoints = tcp:2223:interface=0.0.0.0

# Salida en JSON para el análisis posterior
[output_jsonlog]
enabled = true
logfile = ${honeypot:log_path}/cowrie.json
epoch_timestamp = false
